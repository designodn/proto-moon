# docker-compose для VM (Yandex Compute Cloud).
#
# На VM лежит копия репозитория в /opt/proto-moon; SourceCraft CI на каждый
# push в main заливает свежий код и делает `docker compose up -d --build`.
# Сервис — server.mjs: раздаёт готовую статику и больше ничего. Контент
# («запечённые» data/*.json|js и HTML) обновляет автор локально скриптами
# scripts/fetch-*.mjs и коммитит в репозиторий — ни синка из Google-таблицы,
# ни выгрузки медиа в облако на сервере нет.
services:
  web:
    build: .
    restart: always
    ports:
      - "80:8080"          # наружу 80 → внутри контейнера PORT=8080
    environment:
      - PORT=8080
